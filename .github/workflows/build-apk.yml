name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      # ================================================================
      # BARU: Copy lib offline (KaTeX, SweetAlert2, GSAP, Font Roboto)
      # dari node_modules ke www/libs, biar app jalan tanpa internet.
      # Pastikan katex, sweetalert2, gsap, @fontsource-variable/roboto,
      # dan @fontsource-variable/roboto-mono ada di package.json (lihat
      # catatan terpisah).
      # ================================================================
      - name: Copy Offline Libs (KaTeX, SweetAlert2, GSAP, Font)
        run: |
          mkdir -p www/libs/katex www/libs/sweetalert2 www/libs/gsap
          mkdir -p www/libs/fonts/roboto www/libs/fonts/roboto-mono

          cp -r node_modules/katex/dist/. www/libs/katex/
          cp node_modules/sweetalert2/dist/sweetalert2.min.js www/libs/sweetalert2/
          cp node_modules/sweetalert2/dist/sweetalert2.min.css www/libs/sweetalert2/
          cp node_modules/gsap/dist/gsap.min.js www/libs/gsap/
          cp -r node_modules/@fontsource-variable/roboto/. www/libs/fonts/roboto/
          cp -r node_modules/@fontsource-variable/roboto-mono/. www/libs/fonts/roboto-mono/

          echo "=== Isi www/libs setelah copy ==="
          find www/libs -maxdepth 3

      - name: Initialize Capacitor Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Patch AndroidManifest for Storage Permission & Cleartext Traffic
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml

          # 1. Tambah permission WRITE + READ storage
          sed -i 's|<application|<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>\n    <application|' $MANIFEST

          # 2. Injeksi usesCleartextTraffic="true"
          sed -i 's|<application|<application android:usesCleartextTraffic="true" |' $MANIFEST

          echo "=== AndroidManifest.xml (cek permission & cleartext) ==="
          cat $MANIFEST

      - name: Sync Version & Force True Immersive Fullscreen
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          APP_CODE=$(echo $APP_VERSION | sed 's/\.//g')

          sed -i -E "s/versionCode [0-9]+/versionCode $APP_CODE/g" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"$APP_VERSION\"/g" android/app/build.gradle

          # !!! GANTI package di baris pertama & path folder di bawah ini
          # !!! biar sama persis dengan applicationId di capacitor.config.json
          PKG_PATH=$(echo "com.phygo.app" | tr '.' '/')
          mkdir -p android/app/src/main/java/$PKG_PATH
          cat << 'EOF' > android/app/src/main/java/$PKG_PATH/MainActivity.java
          package com.phygo.app;
          import android.os.Bundle;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  // Render konten di belakang notch/cutout kamera
                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.P) {
                      getWindow().getAttributes().layoutInDisplayCutoutMode =
                          WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                  }

                  // Immersive fullscreen sungguhan: status bar & nav bar disembunyikan total
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                  WindowInsetsControllerCompat controller =
                      new WindowInsetsControllerCompat(getWindow(), getWindow().getDecorView());
                  controller.hide(WindowInsetsCompat.Type.systemBars());
                  controller.setSystemBarsBehavior(
                      WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  );
              }
          }
          EOF

      - name: Download Permanent Keystore
        run: |
          wget https://raw.githubusercontent.com/expo/expo/main/templates/expo-template-bare-minimum/android/app/debug.keystore -O debug.keystore

      - name: Generate Android Icons
        run: npx @capacitor/assets generate --android

      - name: Build APK (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -Pandroid.injected.signing.store.file=${{ github.workspace }}/debug.keystore -Pandroid.injected.signing.store.password=android -Pandroid.injected.signing.key.alias=androiddebugkey -Pandroid.injected.signing.key.password=android

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Phygo-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
