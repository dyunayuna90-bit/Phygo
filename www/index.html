<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<meta name="theme-color" content="#0E1416">
<title>Phygo — Belajar Fisika Interaktif</title>

<!-- Font & lib lokal (offline-ready, tidak ada CDN) -->
<link rel="stylesheet" href="libs/fonts/roboto/index.css">
<link rel="stylesheet" href="libs/fonts/roboto-mono/index.css">
<link rel="stylesheet" href="libs/katex/katex.min.css">
<link rel="stylesheet" href="libs/sweetalert2/sweetalert2.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">
  <main id="main">
    <!-- ===== HOME ===== -->
    <section class="screen active" id="screen-home">
      <div class="scroll-pane" id="homeScroll">
        <div class="home-hero">
          <div class="h-badge">PROGRES BELAJAR</div>
          <h1>Jelajah Fisika</h1>
          <p>Selesaikan tantangan dan kuasai konsep dasar gerak serta gravitasi bumi melalui simulasi interaktif.</p>
        </div>
        <div class="journey-map" id="journeyMap">
          <svg class="j-path-svg" id="jPathSvg"></svg>
        </div>
      </div>
    </section>

    <!-- ===== MATERI ===== -->
    <section class="screen" id="screen-materi">
      <div class="wizard-shell">
        <div class="scroll-pane step-pane" id="materiScroll">
          <span class="eyebrow-pill" id="materiEyebrow"></span>
          <h2 id="materiTitle"></h2>
          <div id="materiBody"></div>
          <div class="formula-box" id="materiFormula"></div>
          <p class="formula-note" id="materiFormulaNote"></p>
        </div>
        <div class="pinned-footer-btn">
          <button class="btn btn-primary btn-block ripple-host" id="btnKeSimulasi">Mulai Simulasi Interaktif</button>
        </div>
      </div>
    </section>

    <!-- ===== SIMULASI (WIZARD) ===== -->
    <section class="screen" id="screen-simulasi">
      <div class="wizard-shell">
        <div class="wizard-progress" id="wizardProgress"></div>
        <div class="scroll-pane step-pane" id="wizardBodyWrap" style="overflow-x:hidden;">
          <div class="wizard-slider" id="wizardBody"></div>
        </div>
        <div class="wizard-footer">
          <button class="btn btn-icon btn-ghost ripple-host" id="wizExit" aria-label="Kembali ke Dashboard"></button>
          <button class="btn btn-icon btn-ghost ripple-host" id="wizBack" aria-label="Kembali"></button>
          <button class="btn btn-primary ripple-host" id="wizPrimary" style="flex:1;">Lanjut</button>
        </div>

        <!-- Pill nyawa mengambang (khusus kuis ujian akhir) — mengambang di atas footer, ga ikut ke-scroll -->
        <div id="quizLivesFloat" class="quiz-lives-float"></div>

        <!-- Quiz Feedback Overlay -->
        <div id="quizFbBackdrop" class="quiz-fb-backdrop"></div>
        <div id="quizFb" class="quiz-feedback">
          <div class="quiz-fb-title" id="qfTitle"></div>
          <div class="quiz-fb-desc" id="qfDesc"></div>
          <div id="qfActions" style="display:flex; flex-direction:column; gap:8px; margin-top:12px;"></div>
        </div>

        <!-- Sad Overlay -->
        <div id="sadOverlay" class="sad-overlay">
           <svg width="140" height="140" viewBox="0 0 24 24" fill="none" stroke="var(--error)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" id="sadHeart">
              <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
              <path d="M12 21l-2-4 4-3-3-4 2-5" id="crackLine" stroke="var(--bg)" stroke-width="3" opacity="0"/>
           </svg>
           <h2 style="margin-top:24px; color:var(--on-surface); font-weight:900; text-shadow:0 2px 4px rgba(0,0,0,0.5);">Kamu Menyerah...</h2>
           <p style="color:var(--on-surface-var); margin-top:8px; text-align:center; font-weight:500;">Tidak apa-apa untuk beristirahat,<br>tapi jangan lupa kembali belajar ya!</p>
        </div>
      </div>
    </section>
  </main>
</div>

<!-- Libs (lokal) -->
<script src="libs/gsap/gsap.min.js"></script>
<script src="libs/katex/katex.min.js"></script>
<script src="libs/sweetalert2/sweetalert2.min.js"></script>

<!-- App modules — urutan load PENTING, jangan diacak -->
<script src="js/helpers.js"></script>
<script src="js/graph.js"></script>
<script src="js/animation.js"></script>
<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/router.js"></script>
<script src="js/screens.js"></script>
<script src="js/level1.js"></script>
<script src="js/level2.js"></script>
<script src="js/level3.js"></script>
<script src="js/app.js"></script>
</body>
</html>
